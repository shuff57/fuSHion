[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/shuff57/studforge"

[workspace.dependencies]
sf-core = { path = "crates/sf-core" }
sf-spec = { path = "crates/sf-spec" }
sf-engine = { path = "crates/sf-engine" }
sf-ldraw = { path = "crates/sf-ldraw" }
sf-render = { path = "crates/sf-render" }
sf-catalog = { path = "crates/sf-catalog" }
sf-export = { path = "crates/sf-export" }
sf-agent = { path = "crates/sf-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
glam = "0.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
png = "0.18"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
csv = "1.4"
clap = { version = "4.6", features = ["derive"] }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
egui-wgpu = "0.37"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process", "sync"] }
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }
schemars = "1"
base64 = "0.23"
rfd = "0.18"
dirs = "6"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
